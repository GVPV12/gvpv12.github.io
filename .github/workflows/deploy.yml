name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Compila (sin publicar) cada pull request, para ver ✅/❌ antes de aceptarlo
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Reconstruye cada día para que la sección Log del home muestre los commits nuevos
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Los PRs no cancelan ni esperan al deploy de main
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Usa la versión de "packageManager" en package.json (la misma que en local)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with Astro
        run: pnpm run build
        env:
          # Solo lectura de repos públicos para la sección Log (sube el límite de la API de GitHub)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Solo se prepara el artefacto de Pages cuando se va a publicar
      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # Nunca publica desde un pull request
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
